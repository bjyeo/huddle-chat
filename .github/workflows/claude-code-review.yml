name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Huddle, a small Discord-style chat app for up to 10 people
            (Express + Socket.IO + node:sqlite backend in server/, React + Vite frontend in client/).
            Read CLAUDE.md and docs/API.md first; docs/API.md is the binding contract.
            Use `gh pr diff` to see the changes and read surrounding files as needed.

            Focus on, in priority order:
            1. Security: auth/session handling, authorization (author-only edits/deletes, channel
               ownership), SQL injection, XSS, secrets, rate limiting, websocket origin checks.
            2. Correctness bugs and contract drift between server, client and docs/API.md.
            3. Realtime edge cases (socket auth, presence, duplicate or missed events, reconnects).
            4. Missing or weak tests for the changed behaviour.

            Post an inline comment (mcp__github_inline_comment__create_inline_comment) for each
            concrete issue, then exactly one top-level summary with `gh pr comment`. If you find
            nothing significant, say so briefly in the summary. Skip style nits Prettier handles.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
