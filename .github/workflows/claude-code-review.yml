name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      HAS_CLAUDE_SECRET: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Explain skip
        if: env.HAS_CLAUDE_SECRET != 'true'
        run: echo "::warning::Claude review skipped - add ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN as a repository secret."
      - uses: actions/checkout@v4
        if: env.HAS_CLAUDE_SECRET == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE_SECRET == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for Huddle, a small Discord-style chat app
            (Express + Socket.IO + SQLite backend in server/, React + Vite frontend in client/).
            Read CLAUDE.md and docs/API.md first; the API contract is the source of truth.

            Focus on, in priority order:
            1. Security: auth/session handling, authorization checks (author-only edits/deletes,
               channel ownership), SQL injection, XSS, secrets, rate limiting.
            2. Correctness bugs and contract drift between server, client and docs/API.md.
            3. Realtime edge cases (socket auth, presence, duplicate or missed events).
            4. Missing or weak tests for the changed behaviour.

            Use inline comments for specific lines and a single top-level summary comment.
            Be concise; skip style nits that Prettier would handle.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
